<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff7a1a" />
  <meta name="description" content="Hanuman's Journey — an endless runner where Hanuman carries Shri Ram's ring across the Setu to Lanka." />
  <title>Hanuman's Journey — Ring to Lanka</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- In-game HUD -->
    <div id="hud" class="hidden" aria-hidden="true">
      <div class="hud-left">
        <div class="hud-score"><span id="score">0</span></div>
        <div class="hud-sub"><span id="distance">0</span> m towards Lanka</div>
      </div>
      <div class="hud-right">
        <div class="hud-rings">💍 <span id="rings">0</span></div>
        <div class="hud-buttons">
          <button id="btn-mute" class="icon-btn" title="Sound">🔊</button>
          <button id="btn-pause" class="icon-btn" title="Pause">⏸</button>
        </div>
      </div>
      <div id="toast" class="toast"></div>
    </div>

    <!-- Start screen -->
    <div id="menu" class="overlay">
      <div class="panel">
        <div class="crest">🛕</div>
        <h1>Hanuman's Journey</h1>
        <p class="tag">Carry Shri Ram's ring across the Setu to Lanka</p>
        <button id="btn-start" class="primary">▶ Begin the Journey</button>
        <div class="controls">
          <div class="ctl"><b>Swipe / Arrows</b><span>Left · Right to change lane</span></div>
          <div class="ctl"><b>Swipe Up / ↑ / Space</b><span>Jump over logs & rocks</span></div>
          <div class="ctl"><b>Swipe Down / ↓</b><span>Slide under arches</span></div>
        </div>
        <div class="best">Best: <span id="best-menu">0</span></div>
      </div>
    </div>

    <!-- Pause screen -->
    <div id="pause" class="overlay hidden">
      <div class="panel">
        <h2>Paused</h2>
        <button id="btn-resume" class="primary">Resume</button>
        <button id="btn-quit" class="ghost">Quit to Menu</button>
      </div>
    </div>

    <!-- Game over screen -->
    <div id="over" class="overlay hidden">
      <div class="panel">
        <div class="crest">🙏</div>
        <h2 id="over-title">Jai Shri Ram!</h2>
        <div class="results">
          <div class="res"><span id="final-score">0</span><small>Score</small></div>
          <div class="res"><span id="final-dist">0</span><small>Metres</small></div>
          <div class="res"><span id="final-rings">0</span><small>Rings</small></div>
        </div>
        <div id="new-best" class="new-best hidden">✨ New Best!</div>
        <button id="btn-retry" class="primary">Run Again</button>
        <button id="btn-menu" class="ghost">Menu</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/obstacles.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
